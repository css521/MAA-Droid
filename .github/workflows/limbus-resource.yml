name: 边狱资源包（跟随 LALC 上游）

# 为什么需要这条流水线：
# 上游 LALC 没有资源专用 feed —— 它只发一个 249 MB 的 Windows 整包（含 Python 运行时、
# 无清单、无逐文件 sha256），App 无法据此做增量热更。故由本流水线盯它的 tag，
# 只取 config/task、config/language、img、ai/model、recognize/models 五份重打包成约 43 MB 带 sha256
# 清单的资源包发 Release，App 只订阅这一条 feed。
#
# 效果：上游改流程 / 模板 / 阈值 → 用户靠热更无感跟随，不必发 APK；
# 上游引入本 App 未实现的动作 → 清单的 required_actions 让 App 侧门闸拒绝装载并提示升级。

on:
  schedule:
    # 每天 UTC 21:17（北京时间次日 05:17）。错开整点，避免与大量定时任务撞在一起
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: '上游 ref（默认取最新 tag）'
        required: false
        type: string
      dry_run:
        description: '只校验不发布'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: 取本仓库（需要打包脚本与动作白名单）
        uses: actions/checkout@v4

      - name: 解析上游最新 tag
        id: upstream
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.upstream_ref }}" ]; then
            REF="${{ inputs.upstream_ref }}"
          else
            # 必须过滤成 vX.Y.Z 形态：上游存在 v_tat_2.1.5 / v_tag_2.1.6 这类
            # 非语义化 tag（历史遗留），--sort=-v:refname 会把它们排到最前，
            # 不过滤会导致 CI 去打包一个错误的旧版本（实测踩到过）
            REF=$(git -c 'versionsort.suffix=-' ls-remote --tags --refs --sort=-v:refname \
              https://github.com/HSLix/LixAssistantLimbusCompany.git \
              | sed 's#.*refs/tags/##' \
              | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
              | head -n1)
          fi
          [ -n "$REF" ] || { echo "::error::未解析到上游 tag"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=limbus-resource-$REF" >> "$GITHUB_OUTPUT"
          echo "上游 ref: $REF"

      # 不能再用"tag 已存在就跳过"来判断：资源包内容除了上游源码，还取决于本仓库的
      # 打包脚本与动作白名单。上游不发新版而我们的产物变了时，那种判断会永久跳过，
      # 修正推不出去（用户只能等 APK）。改为：先算出**待发布**的修订号，用它打包，
      # 再拿内容摘要与已发布版本比对，只有真的变了才占用这个 tag。
      - name: 解析待发布的资源修订号
        id: rev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: limbus-resource-${{ steps.upstream.outputs.ref }}
        run: |
          set -euo pipefail
          gh release list --limit 200 --json tagName -q '.[].tagName' > /tmp/tags.txt || : > /tmp/tags.txt
          python3 - <<'PY' > /tmp/rev.env
          import os, re
          base = os.environ["BASE"]
          # 同一上游 tag 下可以有多次资源修订：base 本身视为修订 0，其后是 base.1 / base.2…
          pattern = re.compile(rf"^{re.escape(base)}(?:\.(\d+))?$")
          revs = sorted(
              int(m.group(1) or 0)
              for line in open("/tmp/tags.txt")
              if (m := pattern.match(line.strip()))
          )
          top = revs[-1] if revs else None
          nxt = base if top is None else f"{base}.{top + 1}"
          prev = "" if top is None else (base if top == 0 else f"{base}.{top}")
          print(f"prev={prev}")
          print(f"next={nxt}")
          # 去前缀给 Release 标题用（limbus-resource-v5.0.0.1 → v5.0.0.1）
          print(f"version={nxt.removeprefix('limbus-resource-')}")
          PY
          cat /tmp/rev.env
          cat /tmp/rev.env >> "$GITHUB_OUTPUT"

      - name: 取上游该 tag 的源码
        uses: actions/checkout@v4
        with:
          repository: HSLix/LixAssistantLimbusCompany
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 打包并校验
        run: |
          set -euo pipefail
          # 打包器会做三重校验：流水线引用可达、模板存在、语言目录结构保留。
          # 任一不过即非零退出且不产出资源包 —— 绝不发布一个跑到中途才崩的包。
          #
          # --tag 记录真实上游 tag（进 manifest.upstream.tag）；--package-tag 决定 zip 文件名，
          # 必须与 Release 的 tag 同名，App 按 releaseAssetUrl 的 {tag}.zip 取包。
          python scripts/pack_engine_resource.py \
            --engine limbus \
            --upstream upstream \
            --tag "${{ steps.upstream.outputs.ref }}" \
            --package-tag "${{ steps.rev.outputs.next }}" \
            --out dist

      - name: 与已发布版本比对内容摘要
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREV: ${{ steps.rev.outputs.prev }}
        run: |
          set -euo pipefail
          # manifest.revision 是对 (path, sha256) 求的稳定摘要，与打包时间、zip 字节无关。
          # 所以内容没变的日常巡检不会因为时间戳差异而误发一版。
          NEW=$(python3 -c "import json;print(json.load(open('dist/manifest.json'))['revision'])")
          echo "新产物   revision=$NEW"
          if [ -z "$PREV" ]; then
            echo "该上游版本尚无资源包，直接发布"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 区分两种失败：资源本身不存在（老版本没带 manifest）→ 无从比对，按"已变"发布；
          # 存在却下不下来（网络/限流）→ 让这一步失败。宁可红一次巡检，也不要因为一次
          # 网络抖动就误发一版让所有用户白下 43MB。
          if ! gh release view "$PREV" --json assets -q '.assets[].name' | grep -qx manifest.json; then
            echo "::warning::$PREV 没有 manifest.json 资源，无法比对内容，按已变更处理"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$PREV" -p manifest.json -D prev --clobber
          OLD=$(python3 -c "import json;print(json.load(open('prev/manifest.json'))['revision'])")
          echo "已发布   revision=$OLD ($PREV)"
          if [ "$NEW" = "$OLD" ]; then
            echo "内容一致，无需发布"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "内容已变，发布 ${{ steps.rev.outputs.next }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 摘要
        run: |
          {
            echo "## 边狱资源包 ${{ steps.rev.outputs.version }}"
            echo "上游 LALC ${{ steps.upstream.outputs.ref }}｜内容变更: ${{ steps.diff.outputs.changed }}"
            echo '```json'
            python -c "import json;m=json.load(open('dist/manifest.json'));m['files']=f\"<{len(m['files'])} 个文件>\";print(json.dumps(m,ensure_ascii=False,indent=2))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 Release
        if: steps.diff.outputs.changed == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.rev.outputs.next }}" \
            dist/*.zip dist/manifest.json \
            --title "边狱资源包 ${{ steps.rev.outputs.version }}" \
            --notes "自动跟随上游 [LALC ${{ steps.upstream.outputs.ref }}](https://github.com/HSLix/LixAssistantLimbusCompany/releases/tag/${{ steps.upstream.outputs.ref }}) 重打包。

            仅含 config/task、config/language、img、ai/model、recognize/models 五份，不含 Python 运行时。
            清单带逐文件 sha256 与 required_actions，App 装载前会做兼容门闸校验。"
