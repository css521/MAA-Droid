# 版本号基线
#
# 从原 MAA-Meow 仓库（688 个提交，最后 tag v0.21.2）切出为独立仓库时留下的基线。
# 新仓库的提交历史从 1 开始，若仍按提交数直接当 versionCode，会从 688 掉回 1 ——
# Android 拒绝安装 versionCode 更低的包，已装用户将无法升级，应用内更新也会错乱。
#
# 因此：versionCode = versionCodeBase + 本仓库提交数（单调递增，永不回退）。
versionCodeBase=688

# 仓库尚无 tag 时的回退版本名。
# `git describe --tags --always` 在无 tag 时返回短 hash，不符合 vX.Y.Z 无法解析，
# 故用此值兜底；一旦打出符合 vX.Y.Z 的 tag，即由 git describe 接管。
versionNameFallback=0.21.3
